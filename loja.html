<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7c3aed">
<title>Nossos produtos</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>body{padding-bottom:110px}.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);padding:12px 16px;z-index:5}.bar .total{margin:0 0 8px}
.qtd{display:flex;align-items:center;gap:10px;margin-top:8px}.qtd button{width:36px;height:36px;border-radius:50%;border:0;background:#eee9f7;color:var(--p);font-size:1.3rem;font-weight:700}.qtd b{min-width:22px;text-align:center;font-size:1.05rem}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:#e7f7ec;color:var(--ok);margin-top:4px}.tag.enc{background:#fff7e0;color:#a16207}.oferta{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff7e0;border:1px dashed #f59e0b;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.85rem}.oferta.on{background:#e7f7ec;border-color:var(--ok)}.oferta .btn{flex:none;padding:6px 10px}.oferta small{color:var(--mut)}.qtd.mini{margin:0;gap:6px}.qtd.mini button{width:28px;height:28px;font-size:1rem}.upsell{margin-top:12px;padding-top:10px;border-top:1px dashed var(--bd)}
.pixqr{display:flex;justify-content:center;margin:10px 0}.pixqr svg{width:200px;height:200px}.pixcod{font-family:monospace;font-size:.72rem;word-break:break-all;background:#f3f0fa;padding:8px;border-radius:8px}</style>
</head>
<body>
<header class="top"><h1 id="tt">Nossos produtos</h1></header>
<main id="lista"><div class="vazio">Carregando...</div></main>
<div class="bar" hidden><div class="total" id="tot"></div><button class="btn full" id="seguir" style="margin:0">Continuar</button></div>
<div id="lb" class="lb" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="pix.js"></script>
<script src="loja.js"></script>
</body>
</html>
